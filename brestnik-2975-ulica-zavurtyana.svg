<text x="16.0" y="1790.4" font-size="8.5" font-weight="400" fill="#55534e" text-anchor="start">Тъмнозелено с точки: ивицата на всяка къща, оградена с жив плет; всичко зелено в нея е частен двор. Сив правоъгълник с пунктир: паркомястото на къщата. Чертичките: входовете.</text>
<text x="16.0" y="1812.8" font-size="8.5" font-weight="400" fill="#55534e" text-anchor="start">К1–К11: дворът е пред къщата, откъм улицата, а отзад има ивица от 3 м до границата. К12–К21: дворът е зад къщата. Бледозеленото е общо.</text></g></svg>