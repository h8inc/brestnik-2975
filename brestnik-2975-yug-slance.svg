400" y1="340" x2="339.1" y2="112.9" stroke="#55534e" stroke-width="1.5" stroke-dasharray="5 4"/><text x="325.2" y="83.3" font-size="10.5" text-anchor="end" fill="#55534e">входове · 345°</text><circle cx="400" cy="340" r="4" fill="#1d1d1b"/><text x="780" y="120" font-size="12.5" font-weight="700" fill="#1d1d1b">Добрата практика за 42° с.ш.:</text><text x="780" y="141" font-size="11.5" font-weight="400" fill="#55534e">• главните стаи и дворът на юг, допустимо ±15–20°;</text><text x="780" y="162" font-size="11.5" font-weight="400" fill="#55534e">• при горещо лято по-добре леко към изток, отколкото към запад:</text><text x="780" y="183" font-size="11.5" font-weight="400" fill="#55534e">   сутрешното слънце топли, следобедното прегрява;</text><text x="780" y="204" font-size="11.5" font-weight="400" fill="#55534e">• входът, стълбата и сервизите на север;</text><text x="780" y="225" font-size="11.5" font-weight="400" fill="#55534e">• към запад плътни стени и малко стъкло, заради жегата и вятъра.</text><text x="780" y="246" font-size="11.5" font-weight="400" fill="#55534e"></text><text x="780" y="267" font-size="11.5" font-weight="400" fill="#1d1d1b">Досегашните дворове гледаха на 207°, 27° към запад от юг.</text><text x="780" y="288" font-size="11.5" font-weight="400" fill="#1d1d1b">Новите гледат на 165°, 15° към изток от юг.</text><text x="780" y="309" font-size="11.5" font-weight="400" fill="#55534e"></text><text x="780" y="330" font-size="11.5" font-weight="400" fill="#55534e">Всяка къща е отстъпена с 4,00 м от западната си съседка,</text><text x="780" y="351" font-size="11.5" font-weight="400" fill="#55534e">така съседната къща закрива терасата от запад: от вятъра</text><text x="780" y="372" font-size="11.5" font-weight="400" fill="#55534e">и от лятното слънце след 15 ч. На изток терасата е открита</text><text x="780" y="393" font-size="11.5" font-weight="400" fill="#55534e">за сутрешното слънце.</text></svg>